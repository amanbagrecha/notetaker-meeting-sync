  // ---------- to-do notes thread ----------
  const threadIs = (date, id) => C.mode === "todo" && T.date === date && T.id === id;
  const threadKey = () => `${T.date}:${T.id}`;

  function markOpen() {
    root.querySelectorAll("li.todo").forEach(li => li.classList.toggle("th-open", threadIs(li.dataset.date, li.dataset.id)));
  }

  function linkify(s) {
    const re = /\bhttps?:\/\/[^\s<>"']+/gi;
    let out = "", last = 0, m;
    while ((m = re.exec(s))) {
      let url = m[0].replace(/[.,;:!?'"]+$/, "");
      if (url.endsWith(")") && !url.includes("(")) url = url.slice(0, -1);
      out += esc(s.slice(last, m.index)) + `<a href="${esc(url)}" target="_blank" rel="noopener">${esc(url)}</a>`;
      last = m.index + url.length;
      re.lastIndex = last;
    }
    return out + esc(s.slice(last));
  }

  function fullTime(ts) {
    const d = new Date(ts);
    return isNaN(d.getTime()) ? "" : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
  }

  function autosize(ta) {
    if (!ta) return;
    ta.style.height = "auto";
    ta.style.height = `${ta.scrollHeight + 2}px`;
  }

  function localTodo(date, id) {
    if (S.day && S.day.date === date) {
      const t = S.day.todos.find(x => x.id === id);
      return t ? { ...t, notes: (t.notes || []).slice() } : null;
    }
    const t = ((dayRow(date) || {}).todos || []).find(x => x.id === id);
    return t ? { ...t, notes: t.note_count ? undefined : [] } : null;
  }

  function openThreadParam(date, id) {
    setMany({ chat: null, todo: `${date}:${id}` });
  }

  function openThread(date, id) {
    if (C.abort) C.abort.abort();
    Object.assign(C, { mode: "todo", mid: null, date: null, busy: false, stream: "", abort: null });
    const todo = localTodo(date, id);
    const known = !!todo && Array.isArray(todo.notes) && !!S.day && S.day.date === date;
    const meeting = known ? S.day.meetings.find(m => m.id === todo.meeting_id) || null : null;
    Object.assign(T, { date, id, todo, meeting, loading: !known, error: "", editing: null, editText: "", stick: true, focus: true });
    renderDrawer();
    markOpen();
    if (known) return;
    noteCall(date, id, { op: "get" }).then(ok => {
      if (!threadIs(date, id)) return;
      T.loading = false;
      if (!ok) T.error = "Couldn't open this to-do's notes — it may have been moved or deleted.";
      renderDrawer();
    });
  }

  function refreshThread() {
    if (C.mode !== "todo" || !T.todo) return;
    const full = S.day && S.day.date === T.date ? S.day.todos.find(x => x.id === T.id) : null;
    const src = full || ((dayRow(T.date) || {}).todos || []).find(x => x.id === T.id);
    if (!src) {
      const gone = (S.day && S.day.date === T.date) || dayRow(T.date);
      if (gone && !T.error) { T.error = "This to-do is no longer on that page — it was moved or deleted."; renderDrawer(); }
      return;
    }
    const mine = T.todo.notes;
    const settled = full && !queued && !T.editing && !(mine || []).some(x => x.pending);
    const next = { ...T.todo, ...src, notes: settled ? (full.notes || []).slice() : mine };
    if (JSON.stringify(next) === JSON.stringify(T.todo)) return;
    T.todo = next;
    renderDrawer();
  }

  let noteQueue = Promise.resolve(), queued = 0;
  function noteCall(date, id, args) {
    queued++;
    const run = async () => {
      let r = null, err = null;
      try { r = await fused.runPython("./notes.py", { date, todo_id: id, ...args }, { key: null }); }
      catch (e) { err = e; }
      queued--;
      if (err && args.op !== "get") {
        toast(err.message || "Couldn't save the note");
        if (!queued) { try { r = await fused.runPython("./notes.py", { date, todo_id: id, op: "get" }, { key: null }); } catch (e) { r = null; } }
      }
      if (r) adoptThread(r, args.op !== "get");
      return !err;
    };
    const p = noteQueue.then(run);
    noteQueue = p.catch(() => {});
    return p;
  }

  function adoptThread(r, changed) {
    const t = r.todo, notes = t.notes || [];
    if (r.index) S.index = r.index;
    if (S.day && S.day.date === r.date) S.day.todos.forEach(x => { if (x.id === t.id) x.notes = notes.slice(); });
    if (threadIs(r.date, t.id) && !queued) {
      T.todo = { ...t, notes: notes.slice() };
      if (r.meeting) T.meeting = r.meeting;
      T.error = "";
      renderDrawer();
    }
    if (changed) render();
  }

  function addNote(text) {
    text = (text || "").trim();
    if (!text || C.mode !== "todo" || !T.todo) return;
    const { date, id } = T, key = threadKey(), tmp = `tmp-${Date.now()}`;
    if (!Array.isArray(T.todo.notes)) T.todo.notes = [];
    T.todo.notes.push({ id: tmp, text, at: new Date().toISOString(), pending: true });
    drafts.delete(key);
    T.stick = true;
    renderDrawer();
    noteCall(date, id, { op: "add", text }).then(ok => {
      if (ok) return;
      if (!drafts.get(key)) drafts.set(key, text);
      if (!threadIs(date, id) || !T.todo) return;
      T.todo.notes = (T.todo.notes || []).filter(x => x.id !== tmp);
      const ta = $("#noteInput");
      if (ta && !ta.value) { ta.value = text; autosize(ta); }
      renderDrawer();
    });
  }

  function saveNoteEdit() {
    const nid = T.editing;
    if (!nid || !T.todo) return;
    const ed = drawer.querySelector(".note-edit");
    const text = (ed ? ed.value : T.editText).trim();
    const note = (T.todo.notes || []).find(x => x.id === nid);
    T.editing = null;
    if (note && text && text !== note.text) {
      note.text = text; note.edited_at = new Date().toISOString();
      noteCall(T.date, T.id, { op: "edit", note_id: nid, text });
    }
    renderDrawer();
  }

  function deleteNote(nid) {
    if (!T.todo) return;
    T.todo.notes = (T.todo.notes || []).filter(x => x.id !== nid);
    renderDrawer();
    noteCall(T.date, T.id, { op: "delete", note_id: nid });
  }

  function armed(el, label) {
    if (el.dataset.armed === "1") return true;
    const old = el.textContent;
    el.dataset.armed = "1"; el.textContent = label; el.classList.add("armed");
    setTimeout(() => { if (el.isConnected) { el.dataset.armed = ""; el.textContent = old; el.classList.remove("armed"); } }, 3000);
    return false;
  }

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; } catch (e) { }
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  }

  function threadHeadHTML(t) {
    return `<button class="cb" role="checkbox" aria-checked="${!!t.done}" data-act="th-toggle" title="${t.done ? "Mark as not done" : "Mark as done"}"></button>
      <div><div class="kick">To-do · ${esc(short(T.date))}</div><h3 class="th-title ${t.done ? "done" : ""}" data-act="th-title" title="Click to edit">${esc(t.text)}</h3></div>
      <button class="x" data-act="close" title="Close (Esc)">×</button>`;
  }

  function threadLogHTML(t) {
    const notes = t.notes || [];
    const facts = todoChips(t, T.date, (T.meeting && T.meeting.title) || t.meeting_title || "");
    const items = notes.map(x => {
      if (T.editing === x.id) {
        return `<div class="note" data-nid="${esc(x.id)}"><textarea class="note-edit" rows="2" aria-label="Edit note">${esc(T.editText)}</textarea>
          <div class="note-edit-row"><button type="button" class="tb-btn" data-act="note-cancel">Cancel</button><button type="button" class="btn" data-act="note-save">Save</button></div></div>`;
      }
      return `<div class="note ${x.pending ? "pending" : ""}" data-nid="${esc(x.id)}">
        <div class="note-h"><span title="${esc(fullTime(x.at))}">${esc(rel(x.at))}</span>${x.edited_at ? `<span title="Edited ${esc(fullTime(x.edited_at))}">· edited</span>` : ""}
          ${x.pending ? "" : `<span class="note-acts"><button data-act="note-copy" title="Copy this note">Copy</button><button data-act="note-edit">Edit</button><button data-act="note-del">Delete</button></span>`}</div>
        <div class="note-body">${linkify(x.text)}</div></div>`;
    }).join("");
    const body = !Array.isArray(t.notes) ? `<div class="th-empty">Loading notes…</div>`
      : notes.length ? items
      : `<div class="th-empty">Nothing here yet. Keep updates, drafts and links for this to-do here — they stay off the notebook page.</div>`;
    return `${t.context || facts ? `<div class="th-root">${t.context ? `<div class="th-ctx">${esc(t.context)}</div>` : ""}${facts ? `<div class="th-facts">${facts}</div>` : ""}</div>` : ""}
      <div class="th-div">${notes.length ? `${notes.length} note${notes.length > 1 ? "s" : ""}` : "Notes"}</div>
      ${body}
      ${T.error ? `<div class="msg err">${esc(T.error)}</div>` : ""}`;
  }

  function renderThread() {
    const t = T.todo;
    if (!t) {
      drawer.innerHTML = `<div class="dr-head"><div><div class="kick">To-do notes</div><h3>${T.loading ? "Opening…" : "To-do not found"}</h3></div><button class="x" data-act="close" title="Close (Esc)">×</button></div>
        <div class="log scroll">${T.loading ? `<div class="th-empty">Opening the to-do…</div>` : `<div class="msg err">${esc(T.error || "This to-do isn't on that page any more.")}</div>`}</div>`;
      return;
    }
    const key = threadKey();
    if (drawer.dataset.thread !== key || !$("#noteInput")) {
      drawer.dataset.thread = key;
      drawer.innerHTML = `<div class="dr-head"></div><div class="log scroll" id="thLog"></div>
        <form class="composer" data-form="note"><textarea id="noteInput" rows="2" placeholder="Add an update, a draft or a link…" aria-label="Add a note"></textarea><button class="btn">Add</button></form>
        <div class="dr-foot"><span class="hint">Enter to add · Shift+Enter for a new line</span></div>`;
      const fresh = $("#noteInput");
      fresh.value = drafts.get(key) || "";
      autosize(fresh);
    }
    const head = drawer.querySelector(".dr-head");
    if (!head.querySelector(".th-title-edit")) head.innerHTML = threadHeadHTML(t);
    const log = $("#thLog"), keepScroll = log.scrollTop;
    const prevEd = log.querySelector(".note-edit"), edFocus = !!prevEd && document.activeElement === prevEd;
    const caret = prevEd ? [prevEd.selectionStart, prevEd.selectionEnd] : null;
    if (prevEd) T.editText = prevEd.value;
    log.innerHTML = threadLogHTML(t);
    log.scrollTop = T.stick ? log.scrollHeight : keepScroll;
    T.stick = false;
    const ed = log.querySelector(".note-edit");
    if (ed) {
      autosize(ed);
      if (edFocus || T.focusEdit) {
        ed.focus();
        const [a, b] = edFocus && caret ? caret : [ed.value.length, ed.value.length];
        ed.setSelectionRange(a, b);
      }
    } else if (edFocus || T.focus) $("#noteInput").focus();
    T.focus = false; T.focusEdit = false;
  }

  // ---------- sync (Claude task with the Wispr Flow MCP) ----------
  async function startSync(dates) {
    if (!LOCAL || S.starting || activeSync().length) return;
    if (dates) { S.starting = true; render(); }
    try {
      const r = dates
        ? await fused.runPython("./sync.py", { op: "request", dates: dates.join(",") }, { key: "sync" })
        : await fused.runPython("./sync.py", { op: "plan" }, { key: "sync" });
      if (!r.dates.length) return;
      if (!S.starting) { S.starting = true; render(); }
      const h = await fused.tasks.create({ prompt: r.prompt, title: `Meeting sync · ${r.dates.map(shortNoWd).join(", ")}`, permissionMode: "auto", queue: false });
      fused.runPython("./sync.py", { op: "mark", request_id: r.request_id, entry_id: h.entryId }, { key: null }).catch(() => {});
      S.syncTasks = [{ key: h.key, status: "upcoming", title: "Meeting sync" }, ...S.syncTasks];
      if (dates) toast(`Claude is syncing ${r.dates.map(shortNoWd).join(", ")} from Calendar + Wispr Flow`);
      h.done.then(() => reload());
    } catch (e) {
      toast(e.message || "Couldn't start the sync");
    } finally {
      if (S.starting) { S.starting = false; render(); }
    }
  }

  // ---------- Notion tickets (Claude task with the Notion connector) ----------
  // Only the to-dos picked in the tray go out; notion.py marks them queued and writes the prompt.
  async function sendToNotion() {
    if (!LOCAL || S.sending || !S.nsel.size) return;
    S.sending = true; render();
    let r = null;
    try {
      const items = [...S.nsel.values()].map(x => `${x.date}:${x.id}`).join(",");
      r = await fused.runPython("./notion.py", { op: "request", items }, { key: null });
      S.nsel.clear();
      S.index = r.index;
      if (!r.count) { toast("Those to-dos already have Notion tickets"); return; }
      const h = await fused.tasks.create({ prompt: r.prompt, title: `Notion tickets · ${r.count} to-do${r.count > 1 ? "s" : ""}`, permissionMode: "auto", queue: false });
      S.notionTasks = [{ key: h.key, status: "upcoming", title: "Notion tickets" }, ...S.notionTasks];
      toast(`Claude is creating ${r.count} ticket${r.count > 1 ? "s" : ""} in ${r.database}`);
      h.done.then(() => reload());
    } catch (e) {
      if (r && r.request_id) await fused.runPython("./notion.py", { op: "cancel", request_id: r.request_id }, { key: null }).catch(() => {});
      toast(e.message || "Couldn't start the Notion task");
    } finally {
      S.sending = false;
      render();
      reload();
    }
  }

  let lastStatus = new Map();
  function onTasks(rows) {
    const mine = rows.filter(t => /^(Meeting sync|Notion tickets)/.test(t.title || ""));
    let finished = false;
    for (const t of mine) {
      const id = t.entry_id || t.key, before = lastStatus.get(id);
      if (before && before !== t.status && !ACTIVE.has(t.status)) finished = true;
      lastStatus.set(id, t.status);
    }
    const wasActive = activeSync().length > 0, wasNotion = activeNotion().length > 0;
    S.syncTasks = mine.filter(t => /^Meeting sync/.test(t.title));
    S.notionTasks = mine.filter(t => /^Notion tickets/.test(t.title));
    if (finished) reloadSoon();
    if (wasActive !== activeSync().length > 0 || wasNotion !== activeNotion().length > 0 || finished) render();
    else {
      const box = root.querySelector(".syncbox"); if (box) box.outerHTML = syncBoxHTML(P());
      const tray = root.querySelector(".tray"); if (tray && !S.nsel.size) tray.outerHTML = trayHTML();
    }
  }

  async function autoTick() {
    if (!LOCAL || document.hidden) return;
    if (S.settings.auto_sync && !activeSync().length) await startSync(null);
    reload();   // quiet: merges anything a sync (from here or elsewhere) has written so far
  }

  // ---------- events ----------
  let toastTimer = 0;
  function toast(msg) {
    const el = $("#toast"); el.textContent = msg; el.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 3600);
  }

  function shiftMonth(month, delta) {
    const [y, m] = month.split("-").map(Number);
    const d = new Date(y, m - 1 + delta, 1);
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  }

  function scrollToMeeting(mid) {
    const el = document.getElementById(`mtg-${mid}`);
    if (!el) return;
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }

  let rowTimer = 0, rowOpened = null;
  function rowClick(e) {
    const li = e.target.closest("li.todo");
    if (!li || e.target.closest("a, input, textarea") || String(window.getSelection() || "")) return;
    clearTimeout(rowTimer);
    if (e.detail > 1) return;
    const { date, id } = li.dataset;
    if (e.target.closest(".t-text")) rowTimer = setTimeout(() => { rowOpened = { date, id, at: Date.now() }; openThreadParam(date, id); }, 250);
    else openThreadParam(date, id);
  }

  function noteOf(el) {
    const box = el.closest(".note");
    return box && T.todo ? (T.todo.notes || []).find(x => x.id === box.dataset.nid) : null;
  }

  function editInPlace(el, cls, old, save) {
    const input = document.createElement("input");
    input.className = cls; input.value = old;
    el.replaceWith(input); input.focus(); input.select();
    let done = false;
    const finish = ok => {
      if (done) return; done = true;
      const v = input.value.trim();
      input.classList.remove(cls);
      save(ok && v && v !== old ? v : null);
    };
    input.addEventListener("keydown", k => {
      if (k.isComposing || k.keyCode === 229) return;
      if (k.key === "Enter") finish(true);
      if (k.key === "Escape") { k.stopPropagation(); finish(false); }
    });
    input.addEventListener("blur", () => finish(true));
  }

  document.addEventListener("click", e => {
    const el = e.target.closest("[data-act]");
    if (!el) { rowClick(e); return; }
    const act = el.dataset.act, p = P();
    const li = el.closest(".todo");
    switch (act) {
      case "thread": openThreadParam(li.dataset.date, li.dataset.id); break;
      case "th-toggle": {
        if (!T.todo) break;
        const { date, id } = T, done = !T.todo.done;
        patchTodo(date, id, t => { t.done = done; });
        render();
        mutate(date, { op: "done", todo_id: id, done });
        break;
      }
      case "th-title": {
        if (!T.todo) break;
        const { date, id } = T;
        editInPlace(el, "th-title-edit", T.todo.text, v => {
          if (v) { patchTodo(date, id, t => { t.text = v; }); render(); mutate(date, { op: "edit", todo_id: id, text: v }); }
          else renderDrawer();
        });
        break;
      }
      case "note-copy": {
        const nt = noteOf(el);
        if (nt) copyText(nt.text).then(ok => toast(ok ? "Copied" : "Couldn't copy — select the text instead"));
        break;
      }
      case "note-edit": {
        const nt = noteOf(el);
        if (!nt) break;
        if (T.editing) saveNoteEdit();
        Object.assign(T, { editing: nt.id, editText: nt.text, focusEdit: true });
        renderDrawer();
        break;
      }
      case "note-cancel": T.editing = null; renderDrawer(); break;
      case "note-save": saveNoteEdit(); break;
      case "note-del": {
        const nt = noteOf(el);
        if (nt && armed(el, "Delete?")) deleteNote(nt.id);
        break;
      }
      case "view": setP("view", el.dataset.view); break;
      case "goto": setP("date", el.dataset.date); setP("view", "notebook"); break;
      case "open-day": setP("date", el.dataset.date); setP("view", "notebook"); break;
      case "step": setP("date", addDays(p.date, +el.dataset.delta)); break;
      case "month": setP("month", el.dataset.delta === "0" ? todayISO().slice(0, 7) : shiftMonth(p.month, +el.dataset.delta)); break;
      case "mini": {
        const base = p.view === "calendar" ? p.month : p.date.slice(0, 7);
        const next = shiftMonth(base, +el.dataset.delta);
        if (p.view === "calendar") setP("month", next);
        else setP("date", `${next}-01`);
        break;
      }
      case "toggle": {
        const id = li.dataset.id, date = li.dataset.date, done = el.getAttribute("aria-checked") !== "true";
        patchTodo(date, id, t => { t.done = done; });
        render();
        mutate(date, { op: "done", todo_id: id, done });
        break;
      }
      case "nsel": {
        const k = `${li.dataset.date}|${li.dataset.id}`;
        if (S.nsel.has(k)) S.nsel.delete(k); else S.nsel.set(k, { date: li.dataset.date, id: li.dataset.id });
        render();
        break;
      }
      case "notion-send": sendToNotion(); break;
      case "notion-clear": S.nsel.clear(); render(); break;
      case "del": {
        const id = li.dataset.id, date = li.dataset.date, nn = +el.dataset.notes || 0;
        if (nn && !armed(el, `Delete with ${nn} note${nn > 1 ? "s" : ""}?`)) break;
        if (threadIs(date, id)) closeDrawer();
        S.nsel.delete(`${date}|${id}`);
        if (S.day && S.day.date === date) S.day.todos = S.day.todos.filter(t => t.id !== id);
        const row = dayRow(date); if (row) row.todos = row.todos.filter(t => t.id !== id);
        render();
        mutate(date, { op: "delete", todo_id: id });
        break;
      }
      case "carry": {
        const id = li.dataset.id, date = li.dataset.date, today = todayISO();
        S.nsel.delete(`${date}|${id}`);
        mutate(date, { op: "move", todo_id: id, to_date: today }).then(ok => {
          if (!ok) return;
          toast("Moved to today's page");
          const from = `${date}:${id}`, to = `${today}:${id}`;
          if (drafts.has(from)) { drafts.set(to, drafts.get(from)); drafts.delete(from); }
          if (threadIs(date, id)) { following = id; setP("todo", to); }
        });
        break;
      }
      case "meeting": {
        const date = el.dataset.date, mid = el.dataset.mid;
        if (p.view !== "notebook" || p.date !== date) { setP("date", date); setP("view", "notebook"); pendingScroll = mid; }
        else scrollToMeeting(mid);
        break;
      }
      case "chat": setMany({ todo: null, chat: el.dataset.mid }); break;
      case "close": closeDrawer(); break;
      case "ask": ask(el.dataset.q); break;
      case "stop": if (C.abort) C.abort.abort(); break;
      case "deep": deepAsk(); break;
      case "clear-chat":
        C.messages = []; renderDrawer();
        fused.runPython("./chat.py", { date: C.date, meeting_id: C.mid, op: "clear" }, { key: null }).catch(() => {});
        if (S.day) { const m = S.day.meetings.find(x => x.id === C.mid); if (m) m.chat_count = 0; render(); }
        break;
      case "sync": startSync([el.dataset.date]); break;
      case "task": openTask(el.dataset.key, el.dataset.title || "Meeting sync"); break;
      case "retry": reload(); break;
      case "auto": {
        const on = !S.settings.auto_sync;
        S.settings.auto_sync = on; render();
        fused.runPython("./sync.py", { op: "settings", auto_sync: String(on) }, { key: null })
          .then(r => { S.settings = r.settings; render(); if (on) autoTick(); })
          .catch(err => toast(err.message));
        break;
      }
    }
  });

  document.addEventListener("dblclick", e => {
    clearTimeout(rowTimer);
    const el = e.target.closest(".t-text");
    if (!el) return;
    const li = el.closest(".todo"), id = li.dataset.id, date = li.dataset.date;
    if (rowOpened && rowOpened.date === date && rowOpened.id === id && Date.now() - rowOpened.at < 800 && threadIs(date, id)) closeDrawer();
    rowOpened = null;
    editInPlace(el, "t-edit", el.textContent, v => {
      if (v) { patchTodo(date, id, t => { t.text = v; }); render(); mutate(date, { op: "edit", todo_id: id, text: v }); }
      else render();
    });
  });

  document.addEventListener("input", e => {
    const ta = e.target;
    if (ta.id === "noteInput" && C.mode === "todo") {
      if (ta.value) drafts.set(threadKey(), ta.value); else drafts.delete(threadKey());
      autosize(ta);
    } else if (ta.classList && ta.classList.contains("note-edit")) {
      T.editText = ta.value;
      autosize(ta);
    }
  });

  document.addEventListener("submit", e => {
    const f = e.target;
    e.preventDefault();
    if (f.dataset.form === "add") {
      const input = f.elements.text, text = input.value.trim();
      if (!text) return;
      input.value = "";
      mutate(f.dataset.date, { op: "add", text }).then(() => { const again = root.querySelector('.add-todo input'); if (again) again.focus(); });
    } else if (f.dataset.form === "chat") {
      const ta = $("#chatInput"); const q = ta.value; ta.value = ""; ask(q);
    } else if (f.dataset.form === "note") {
      const ta = $("#noteInput"); const v = ta.value; ta.value = ""; addNote(v);
    }
  });

  document.addEventListener("keydown", e => {
    if (e.isComposing || e.keyCode === 229) return;   // IME composition: Enter picks a candidate
    if (e.target.id === "chatInput" && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault(); const q = e.target.value; e.target.value = ""; ask(q); return;
    }
    if (e.target.id === "noteInput" && e.key === "Enter" && !e.shiftKey) {
      e.preventDefault(); const v = e.target.value; e.target.value = ""; addNote(v); return;
    }
    if (e.target.classList && e.target.classList.contains("note-edit")) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); saveNoteEdit(); return; }
      if (e.key === "Escape") { e.preventDefault(); T.editing = null; renderDrawer(); return; }
    }
    if (e.key === "Escape" && C.mode) { closeDrawer(); return; }
    if (e.key === "Escape" && S.nsel.size && !/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { S.nsel.clear(); render(); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.getAttribute("role") === "button" && e.target.dataset.act) {
      e.preventDefault(); e.target.click(); return;
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    const p = P();
    if (p.view === "notebook" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) setP("date", addDays(p.date, e.key === "ArrowLeft" ? -1 : 1));
  });

  // ---------- param-driven redraw ----------
  let pendingScroll = null, drawnKey = "", following = null;
  function draw() {
    if (batching) return;
    const p = P(), key = `${p.view}|${p.date}|${p.month}`;
    if (p.date !== S.loadedDate && p.date !== S.wantDate) { drawnKey = key; load(p.date).then(afterLoad); render(); return; }
    if (key !== drawnKey || !S.booted) render();
    drawnKey = key;
    afterLoad();
  }
  function afterLoad() {
    const p = P();
    if (pendingScroll && S.loadedDate === p.date) { const mid = pendingScroll; pendingScroll = null; requestAnimationFrame(() => scrollToMeeting(mid)); }
    const th = p.todo && (p.view === "open" || (p.view === "notebook" && (p.todo.date === p.date || p.todo.id === following))) ? p.todo : null;
    following = null;
    const wantChat = !th && LOCAL && p.view === "notebook" && p.chat && S.day && S.day.date === p.date && S.day.meetings.some(m => m.id === p.chat);
    if (th) { if (!threadIs(th.date, th.id)) openThread(th.date, th.id); }
    else if (wantChat) { if (C.mode !== "chat" || C.mid !== p.chat || C.date !== p.date) openChat(p.date, p.chat); }
    else if (C.mode === "todo" || (C.mode === "chat" && (!p.chat || p.view !== "notebook" || C.date !== p.date))) closeDrawer();
  }

  fused.params.onChange(draw);
  draw();

  if (LOCAL) {
    const stop = fused.tasks.watch(rows => onTasks(rows));
    addEventListener("pagehide", () => stop());
    fused.tasks.list().then(onTasks).catch(() => {});
    setTimeout(autoTick, 5000);
    setInterval(autoTick, 10 * 60 * 1000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden && S.booted) reload(); });
    setInterval(() => { if (activeSync().length || activeNotion().length) reload(); }, 60 * 1000);
  }
})();
</script>
</body>
</html>
